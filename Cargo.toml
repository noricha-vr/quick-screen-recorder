[package]
name = "airrec"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
description = "Fast, lightweight native screen recorder for macOS built with Rust and ScreenCaptureKit"
license = "MIT"
repository = "https://github.com/noricha-vr/quick-screen-recorder"
keywords = ["macos", "screen-recorder", "screencapturekit", "gif", "mp4"]
categories = ["multimedia::video", "gui", "command-line-utilities"]

[dependencies]
block2 = "=0.6.2"
color_quant = "=1.1.0"
dispatch2 = "=0.3.1"
gif = { version = "=0.14.2", default-features = false, features = ["std", "raii_no_panic"] }
libc = "=0.2.180"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", features = [
  "NSAlert",
  "NSAppearance",
  "NSApplication",
  "NSAttributedString",
  "NSBezierPath",
  "NSBitmapImageRep",
  "NSBox",
  "NSButton",
  "NSButtonCell",
  "NSColor",
  "NSControl",
  "NSCursor",
  "NSEvent",
  "NSFont",
  "NSGraphics",
  "NSGraphicsContext",
  "NSImage",
  "NSImageView",
  "NSMenu",
  "NSMenuItem",
  "NSPanel",
  "NSPasteboard",
  "NSPopUpButton",
  "NSProgressIndicator",
  "NSResponder",
  "NSRunningApplication",
  "NSSavePanel",
  "NSScreen",
  "NSSegmentedControl",
  "NSSlider",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSStringDrawing",
  "NSText",
  "NSTextField",
  "NSTrackingArea",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-av-foundation = { version = "=0.3.2", features = [
  "AVAsset",
  "AVAssetExportSession",
  "AVAssetImageGenerator",
  "AVAssetTrack",
  "AVAssetWriter",
  "AVAssetWriterInput",
  "AVCaptureDevice",
  "AVError",
  "AVMediaFormat",
  "AVMetadataItem",
  "AVTime",
  "AVVideoComposition",
  "AVVideoSettings",
  "block2",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-core-media",
  "objc2-core-video",
] }
objc2-core-foundation = "=0.3.2"
objc2-core-graphics = { version = "=0.3.2", features = [
  "CGBitmapContext",
  "CGColor",
  "CGColorSpace",
  "CGContext",
  "CGImage",
  "CGSession",
  "CGWindow",
] }
objc2-core-media = { version = "=0.3.2", features = [
  "CMFormatDescription",
  "CMTime",
  "CMTimeRange",
] }
objc2-core-video = { version = "=0.3.2", features = [
  "CVBuffer",
  "CVImageBuffer",
  "CVPixelBuffer",
  "CVReturn",
] }
objc2-foundation = { version = "=0.3.2", features = [
  "NSAppleEventDescriptor",
  "NSArray",
  "NSAttributedString",
  "NSBundle",
  "NSData",
  "NSDate",
  "NSDictionary",
  "NSDistributedNotificationCenter",
  "NSError",
  "NSFileManager",
  "NSGeometry",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSPathUtilities",
  "NSProcessInfo",
  "NSRange",
  "NSRunLoop",
  "NSString",
  "NSTimer",
  "NSURL",
  "NSValue",
  "block2",
] }
objc2-quartz-core = "=0.3.2"
objc2-screen-capture-kit = { version = "=0.3.2", features = [
  "SCError",
  "SCRecordingOutput",
  "SCScreenshotManager",
  "SCShareableContent",
  "SCStream",
  "bitflags",
  "block2",
  "dispatch2",
  "objc2-av-foundation",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-core-media",
] }
png = "=0.18.1"
rayon = "=1.11.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
strip = "symbols"
lto = "thin"

